<!-- MARKETPLACE -->
<section>
  <div id="marketplace" class="feature-section">
    <div class="feature-header">
      <div class="feature-icon" style="background:var(--amber-50);">🛒</div>
      <div>
        <h2>Farmer Marketplace</h2>
        <p>Buy directly from local farmers — fresh, fair price, no middlemen</p>
      </div>
    </div>

    <form id="market-listing-form" class="market-listing-form role-hidden" data-roles="farmer admin" onsubmit="submitMarketplaceListing(event)">
      <h3>List a product</h3>
      <div class="market-listing-fields">
        <label>Product name<input name="name" required minlength="2" maxlength="100"></label>
        <label>Category<select name="category" required><option value="grains">Grains</option><option value="vegetables">Vegetables</option><option value="fruits">Fruits</option><option value="pulses">Pulses</option></select></label>
        <label>Price (₹)<input name="price" type="number" min="0.01" step="0.01" required></label>
        <label>Unit<input name="unit" placeholder="per kg" required minlength="2" maxlength="30"></label>
        <label>Stock quantity<input name="quantity" type="number" min="1" step="1" required></label>
        <label>Icon<input name="emoji" value="🌾" maxlength="8" aria-label="Product icon"></label>
        <button type="submit">Save listing</button>
      </div>
      <p id="market-listing-status" role="status" aria-live="polite"></p>
    </form>

    <div class="market-filters">
      <button class="filter-btn active" onclick="filterProducts('all', this)">All Products</button>
      <button class="filter-btn" onclick="filterProducts('grains', this)">🌾 Grains</button>
      <button class="filter-btn" onclick="filterProducts('vegetables', this)">🥦 Vegetables</button>
      <button class="filter-btn" onclick="filterProducts('fruits', this)">🍎 Fruits</button>
      <button class="filter-btn" onclick="filterProducts('pulses', this)">🫘 Pulses</button>
    </div>

    <div class="market-grid" id="product-grid"></div>

    <div class="cart-bar">
      <span>🛒 Cart — <span id="cart-count">0</span> items</span>
      <span class="cart-total" id="cart-total">₹0</span>
      <div class="cart-actions">
        <button type="button" onclick="clearCart()">Clear</button>
        <button type="button" onclick="checkoutMarketplace()">Place order</button>
      </div>
    </div>
    <p class="market-note">Orders are recorded locally; payment and delivery are not connected.</p>
    <div class="market-orders">
      <h3>My orders</h3>
      <div id="market-orders" role="status" aria-live="polite">Loading orders...</div>
    </div>
    <p id="market-status" role="status" aria-live="polite"></p>
  </div>
</section>
